{% extends "capteurs/base.html" %}

{% block contenu %}

<h2>Confirmation de suppression</h2>

<p>
    Voulez-vous vraiment supprimer le capteur
    <strong>{{ capteur.nom }}</strong> ?
</p>

<p>
    Attention : cette action est irréversible.
</p>

<form method="post">

    {% csrf_token %}

    <button type="submit">
        Confirmer la suppression
    </button>

</form>

<p>
    <a href="{% url 'capteurs:detail' capteur.pk %}">
        Annuler
    </a>
</p>

{% endblock %}
