
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SensorNet - Gestion des capteurs IoT</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f6fc;
            color: #263449;
        }

        header {
            background: linear-gradient(120deg, #102c54, #1765a7);
            color: white;
            padding: 35px 20px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
        }

        header h1 {
            font-size: 36px;
            margin: 0 0 10px;
        }

        header p {
            margin: 0;
            font-size: 16px;
            color: #d9eafa;
        }

        main {
            max-width: 1100px;
            margin: 35px auto;
            padding: 30px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(20, 45, 80, 0.08);
        }

        h2 {
            color: #174a7e;
            margin-top: 0;
            margin-bottom: 25px;
        }

        a {
            color: #1765a7;
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: white;
        }

        th {
            background-color: #174a7e;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #e5eaf0;
        }

        tr:hover td {
            background-color: #f2f7ff;
        }

        form {
            margin: 20px 0;
        }

        input, select, textarea {
            padding: 10px;
            border: 1px solid #ccd5e0;
            border-radius: 7px;
            font-size: 14px;
            max-width: 100%;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #1765a7;
        }

        button {
            background-color: #1765a7;
            color: white;
            border: none;
            padding: 11px 22px;
            border-radius: 7px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #104d82;
        }

        .errorlist {
            color: #c62828;
            font-size: 14px;
        }

        main p {
            line-height: 1.7;
        }

        @media (max-width: 700px) {
            main {
                margin: 15px;
                padding: 18px;
                overflow-x: auto;
            }

            header h1 {
                font-size: 28px;
            }

            th, td {
                padding: 10px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>SensorNet</h1>
        <p>Application de gestion des capteurs IoT</p>
    </header>

    <main>
        {% block contenu %}
        {% endblock %}
    </main>

</body>
</html>
